name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        env:
          JWT_SECRET_KEY: ${{ secrets.NODECORE_CI_JWT_SECRET }}
          DATABASE_URL: postgresql+psycopg://nodecore:nodecore_password@localhost:5432/nodecore
        run: uv run pytest